# Firebase App Hosting config for backend "ad-radar" in project ad-radar-au.
# https://ad-radar--ad-radar-au.us-central1.hosted.app
# Public values live here; secrets live in Cloud Secret Manager (firebase apphosting:secrets:set).

runConfig:
  minInstances: 0 # scale to zero while this is staging
  maxInstances: 2 # staging cost guard; raise for launch
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Firebase web SDK — NEXT_PUBLIC_* values are inlined into the client bundle at build time.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ad-radar-au.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ad-radar-au
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ad-radar-au.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "981431643534"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:981431643534:web:40f3238cb5c871368488df

  # Server. Admin SDK credentials come from the backend's service account (no keys).
  - variable: FIREBASE_PROJECT_ID
    value: ad-radar-au
    availability: [RUNTIME]
  - variable: FIRESTORE_DATABASE_ID
    value: ad-radar
    availability: [RUNTIME]
  - variable: APP_URL
    value: https://ad-radar--ad-radar-au.us-central1.hosted.app
    availability: [RUNTIME]

  # Stripe — test mode while in staging.
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability: [RUNTIME]
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability: [RUNTIME]
