<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="adradar-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8083ff" />
      <stop offset="100%" stop-color="#7bd0ff" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b25" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>
  </defs>
  <!-- App Icon Background with smooth rounded geometry -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" stroke="url(#adradar-grad)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer Radar Scan Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#adradar-grad)" stroke-width="12" stroke-opacity="0.3" stroke-dasharray="8 8" />
  
  <!-- Middle Radar Scan Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="url(#adradar-grad)" stroke-width="14" stroke-opacity="0.75" />
  
  <!-- Inner Target Ring -->
  <circle cx="256" cy="256" r="48" fill="none" stroke="url(#adradar-grad)" stroke-width="10" stroke-opacity="0.9" />
  
  <!-- Active Radar Beam Sweep -->
  <path d="M 256 256 L 390 122" stroke="url(#adradar-grad)" stroke-width="18" stroke-linecap="round" />
  
  <!-- Core Station Pulse -->
  <circle cx="256" cy="256" r="28" fill="#c0c1ff" />
  
  <!-- Target Found Blip (Emerald Winner Marker) -->
  <circle cx="340" cy="315" r="22" fill="#34d399" />
  <circle cx="340" cy="315" r="34" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.5" />
</svg>

